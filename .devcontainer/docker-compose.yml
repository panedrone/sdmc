services:
  app:
    image: mcr.microsoft.com/devcontainers/go:1
    volumes:
      - ..:/workspaces/sdmc:cached
    command: sleep infinity
    network_mode: service:db # PostgreSQL is localhost:5432 in the app container

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./demo.sql:/docker-entrypoint-initdb.d/demo.sql:ro
