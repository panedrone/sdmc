name: CI

# No database server: the tests generate from SQLite databases they create (in memory or in a
# temporary folder); the PostgreSQL and MySQL code is tested without a connection.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: test (race)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: test
        if: runner.os == 'Windows'
        run: go test ./...
      # coverage of the shipped code by all tests together (-coverpkg): cli/ and internal/meta/metadump
      # are design-time and not counted; the code that needs a live PostgreSQL, MySQL or SQL Server is
      # counted and stays uncovered (CI has no database server)
      - name: coverage
        if: runner.os == 'Linux'
        run: |
          pkgs=$(go list ./... | grep -v -e /cli/ -e /metadump | paste -sd, -)
          go test -coverpkg="$pkgs" -coverprofile=coverage.out $(go list ./... | grep -v /cli/) > /dev/null
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')
          echo "coverage: $total"
          echo "### Coverage: $total" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: coverage
          path: coverage.out
      # the badge of README; without the secret CODECOV_TOKEN the upload fails, CI does not
      - uses: codecov/codecov-action@v5
        if: runner.os == 'Linux'
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      # the C++ and Python data stores in datastore/ are what the templates give (go run ./cli/dsgen)
      - name: generated data stores are up to date
        if: runner.os == 'Linux'
        run: go run ./cli/dsgen && git diff --exit-code -- datastore
